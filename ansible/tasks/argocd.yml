---
- name: Add ArgoCD Helm repository
  kubernetes.core.helm_repository:
    name: argo
    repo_url: https://argoproj.github.io/argo-helm

- name: Install ArgoCD
  kubernetes.core.helm:
    release_name: argocd
    chart_ref: argo/argo-cd
    release_namespace: argocd
    chart_version: "{{ argocd_chart_version }}"
    update_repo_cache: true  # refresh the index so newly pinned chart versions resolve
    create_namespace: true
    kubeconfig: "{{ kubeconfig }}"
    wait: true
    wait_timeout: 5m0s
    release_values:
      configs:
        cm:
          exec.enabled: true
        params:
          server.insecure: true  # TLS terminates at Envoy Gateway; in-cluster hop is plain HTTP
        rbac:
          policy.csv: |
            p, role:admin, exec, create, */*, allow
      controller:
        resources:
          requests:
            cpu: 250m
            memory: 512Mi
          limits:
            cpu: "4"
            memory: 1Gi
      server:
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: "4"
            memory: 1Gi
        extensions:
          enabled: true
          extensionList:
            - name: rollout-extension
              env:
                - name: EXTENSION_URL
                  # v0.4.0+ is built for the React 19 UI shipped with Argo CD 3.5
                  value: https://github.com/argoproj-labs/rollout-extension/releases/download/v0.4.0/extension.tar
      repoServer:
        resources:
          requests:
            cpu: 25m
            memory: 64Mi
          limits:
            cpu: "1"
            memory: 1Gi
      applicationSet:
        resources:
          requests:
            cpu: 25m
            memory: 64Mi
          limits:
            cpu: "1"
            memory: 1Gi
      notifications:
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            cpu: "1"
            memory: 1Gi
      redis:
        resources:
          requests:
            cpu: 25m
            memory: 16Mi
          limits:
            cpu: "1"
            memory: 1Gi
      dex:
        # No SSO is configured; local admin login only. Dex would be an idle
        # OIDC server reachable from argocd-server for nothing.
        enabled: false
