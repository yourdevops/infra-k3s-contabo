---
- name: Set hostname to match DNS name
  ansible.builtin.hostname:
    name: "{{ inventory_hostname }}.{{ domain }}"

- name: Disable and stop UFW (external firewall handles this)
  ansible.builtin.systemd:
    name: ufw
    enabled: false
    state: stopped

- name: Install base packages
  ansible.builtin.apt:
    name:
      - unattended-upgrades
      - apt-listchanges
    state: present
    update_cache: true

- name: Enable unattended-upgrades
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";
      APT::Periodic::AutocleanInterval "7";
    mode: "0644"

- name: Enable security and updates origins for unattended-upgrades
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/50unattended-upgrades
    content: |
      Unattended-Upgrade::Allowed-Origins {
        "${distro_id}:${distro_codename}-security";
        "${distro_id}ESMApps:${distro_codename}-apps-security";
        "${distro_id}:${distro_codename}-updates";
      };
      Unattended-Upgrade::AutoFixInterruptedDpkg "true";
      Unattended-Upgrade::Remove-Unused-Dependencies "true";
      Unattended-Upgrade::Automatic-Reboot "true";
      Unattended-Upgrade::Automatic-Reboot-Time "now";
    mode: "0644"

- name: Create drop-in directory for apt-daily-upgrade timer
  ansible.builtin.file:
    path: /etc/systemd/system/apt-daily-upgrade.timer.d
    state: directory
    mode: "0755"

- name: Run unattended-upgrades on Sunday between 02:00 and 02:30
  ansible.builtin.copy:
    dest: /etc/systemd/system/apt-daily-upgrade.timer.d/override.conf
    content: |
      [Timer]
      OnCalendar=
      OnCalendar=Sun *-*-* 02:00
      RandomizedDelaySec=30m
    mode: "0644"
  register: apt_upgrade_timer_override

- name: Apply apt-daily-upgrade timer schedule
  ansible.builtin.systemd:
    name: apt-daily-upgrade.timer
    daemon_reload: true
    enabled: true
    state: "{{ 'restarted' if apt_upgrade_timer_override.changed else 'started' }}"

- name: Ensure fail2ban is installed
  ansible.builtin.apt:
    name: fail2ban
    state: present

- name: Enable fail2ban
  ansible.builtin.systemd:
    name: fail2ban
    enabled: true
    state: started
